# =====================================================================
# oracle-to-spring-strangler -- canonical local runtime (ADR-0001).
# M1 scope: legacy estate (Oracle XE + ORDS) + target stack
# (PostgreSQL + pricing-service) + the strangler router (nginx) on the
# one public port 8080 (FS-0003/0004). Ports: 8080 router,
# 8081 ORDS direct, 8082 pricing-service direct (debug affordances).
#
# Lab credentials only -- this stack holds fictional seed data and runs
# on a laptop; do not reuse these passwords anywhere real (ADR-0004).
#
# Resources: the Oracle XE image is heavy -- allow ~3 GB image pull,
# ~2.5 GB RAM for the oracle container, first boot takes several minutes.
# amd64-only image: on Apple Silicon use a remote amd64 DOCKER_HOST or
# Docker Desktop Rosetta emulation (slower). The target stack + router
# are multi-arch and run fine alone: `docker compose up -d postgres
# pricing-service router` (legacy routes then answer 502).
# =====================================================================
services:

  oracle:
    image: gvenzl/oracle-xe:21.3.0-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-LabSys#2026}
      APP_USER: legacy
      APP_USER_PASSWORD: ${LEGACY_PASSWORD:-LabLegacy#2026}
    ports:
      - "1521:1521"
    volumes:
      - ./legacy/db/init:/container-entrypoint-initdb.d:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 180s

  ords:
    image: container-registry.oracle.com/database/ords:latest
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-LabSys#2026}
      DB_HOST: oracle
      DB_SERVICE: XEPDB1
    entrypoint: ["/bin/bash", "/ords-entrypoint.sh"]
    ports:
      - "8081:8080"
    volumes:
      - ./legacy/ords/ords-entrypoint.sh:/ords-entrypoint.sh:ro
      - ords-config:/etc/ords/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/ords/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  # one-shot: defines the LEGACY REST modules once ORDS has installed
  # its PL/SQL API into the database (see configure-ords.sh for why
  # this cannot be a DB init script)
  ords-config:
    image: gvenzl/oracle-xe:21.3.0-slim   # reused for its sqlplus client
    depends_on:
      oracle:
        condition: service_healthy
      ords:
        condition: service_started
    environment:
      DB_HOST: oracle
      DB_SERVICE: XEPDB1
      LEGACY_PASSWORD: ${LEGACY_PASSWORD:-LabLegacy#2026}
    entrypoint: ["/bin/bash", "/ords-config/configure-ords.sh"]
    volumes:
      - ./legacy/ords:/ords-config:ro
    restart: "no"

  # ---- target stack (M1, FS-0003) -----------------------------------

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: ${PRICING_DB_PASSWORD:-LabPricing#2026}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 5s
      timeout: 3s
      retries: 12

  pricing-service:
    build: services/pricing-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricing
      SPRING_DATASOURCE_USERNAME: pricing
      SPRING_DATASOURCE_PASSWORD: ${PRICING_DB_PASSWORD:-LabPricing#2026}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---- strangler router (M1, FS-0004) -------------------------------
  # config is GENERATED from strangler/waves.yml -- `make router-config`

  router:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./strangler/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/router/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  oracle-data:
  ords-config:
  pg-data:

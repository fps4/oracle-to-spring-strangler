server {
    listen 8080;

    # the router is deliberately dumb (ADR-0005): route + debug header,
    # no auth, no rewriting beyond the strangler prefix mapping.
    # 127.0.0.11 = Docker's embedded DNS (per-request resolution)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # wave 1: /api/pricing/quote -> target
    location /api/pricing/quote {
        set $upstream_target http://pricing-service:8080;
        rewrite ^/api(/.*)$ /api$1 break;
        proxy_pass $upstream_target;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Served-By target always;
    }

    # wave 2: /api/orders -> legacy
    location /api/orders {
        set $upstream_legacy http://ords:8080;
        rewrite ^/api(/.*)$ /ords/legacy$1 break;
        proxy_pass $upstream_legacy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Served-By legacy always;
    }

    # wave 3: /api/statements/run -> legacy
    location /api/statements/run {
        set $upstream_legacy http://ords:8080;
        rewrite ^/api(/.*)$ /ords/legacy$1 break;
        proxy_pass $upstream_legacy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Served-By legacy always;
    }

    location = /router/healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # unrouted /api paths are an explicit 404, not a silent fallthrough
    location / {
        default_type application/json;
        return 404 '{"error_code":"ROUTER-404","message":"no wave routes this path (see strangler/waves.yml)"}';
    }
}

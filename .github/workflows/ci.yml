# CI (M0 hygiene + M1 build/verify). Grows per roadmap:
#   M2: parity harness on PRs touching services/ or strangler/ (FS-0005)
#   M3: terraform validate + plan-only job (ADR-0001)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # FS-0003 DoD: ./mvnw verify green (unit + slice + Testcontainers;
  # Docker is present on ubuntu-latest runners)
  pricing-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        working-directory: services/pricing-service
        run: ./mvnw -B verify

  # FS-0004 acceptance: routing is fully determined by waves.yml --
  # regenerating the committed nginx config must be a no-op
  router-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate router config from waves.yml
        run: python3 strangler/generate_router_config.py

      - name: Committed config matches waves.yml
        run: git diff --exit-code -- strangler/nginx/

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config -q

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh legacy/ords/*.sh

      - name: SQL init scripts are ASCII-safe and ordered
        run: |
          ls legacy/db/init/ | sort -c
          ! grep -rlP '[^\x00-\x7F]' legacy/db/init/ || \
            (echo 'non-ASCII bytes in init SQL (breaks across DB charsets)'; exit 1)

# Full-stack verification: boot the whole compose stack (Oracle XE +
# ORDS, PostgreSQL + pricing-service, the strangler router) and run
# both smoke suites against it.
#
# Runs on a GitHub-hosted runner. This repository is public, so a pull
# request runs code nobody has reviewed yet, and that code must never
# reach a self-hosted runner. ubuntu-latest is amd64, which the Oracle
# XE image needs.
#
# Triggers: manual dispatch, or add the `stack-smoke` label to a PR.
# Not on every push -- a clean first boot of Oracle XE takes minutes.
name: stack-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: stack-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'stack-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Boot the full stack
        run: docker compose up -d --build

      - name: Legacy smoke (19 assertions, waits for ORDS)
        run: bash scripts/smoke-legacy.sh

      - name: M1 smoke (target + router)
        run: bash scripts/smoke-m1.sh

      - name: Container status on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 100 oracle ords ords-config pricing-service router

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans
